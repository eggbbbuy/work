<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>預約表單</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      padding: 20px;
    }

    .container {
      max-width: 500px;
      margin: auto;
      background: #fff;
      padding: 20px;
      border-radius: 10px;
    }

    h2 {
      text-align: center;
    }

    input, textarea, button {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      border-radius: 5px;
      border: 1px solid #ccc;
      font-size: 16px;
    }

    button {
      background: #000;
      color: #fff;
      cursor: pointer;
    }
  </style>
</head>

<body>

<div class="container">
  <h2>預約表單</h2>

  <input id="name" placeholder="姓名">
  <input id="car" placeholder="車型">
  <input id="time" type="datetime-local">
  <input id="price" placeholder="報價">
  <textarea id="note" placeholder="備註"></textarea>

  <button onclick="submitForm()">送出</button>
</div>

<script>
const GAS_URL = "https://script.google.com/macros/s/AKfycbxEACb3qI5z-XrNNXul8jEWGIUPylGKBUAAIVFIWwlqwbVQbDSZQfHRsBH6yyJuCjyq/exec";

function submitForm() {

  const data = {
    name: document.getElementById("name").value,
    car: document.getElementById("car").value,
    time: document.getElementById("time").value,
    price: document.getElementById("price").value,
    note: document.getElementById("note").value
  };

  fetch(GAS_URL, {
    method: "POST",
    mode: "no-cors",   // 🔥 避開 CORS
    body: JSON.stringify(data)
  })
  .then(() => {
    alert("送出成功");
  })
  .catch(() => {
    alert("送出失敗");
  });
}
</script>

</body>
</html>
